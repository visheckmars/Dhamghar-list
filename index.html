
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f3b2b">
<title>Dhamghar</title>
<style>
:root{
  --green:#1f3b2b;
  --green2:#294d39;
  --gold:#b58a3b;
  --cream:#f7f3eb;
  --paper:#fffdf8;
  --line:#e4d8c5;
  --text:#253127;
  --muted:#786f62;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--cream);
  color:var(--text);
}
header{
  background:var(--green);
  color:white;
  padding:16px 16px 18px;
  position:sticky;
  top:0;
  z-index:5;
  box-shadow:0 3px 16px #0002;
}
.brand{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin-bottom:12px;
}
.logo{
  width:72px;height:72px;object-fit:cover;border-radius:50%;
  border:2px solid var(--gold);
  background:#faf7f0;
  display:block;
}
.title-wrap{text-align:center}
.brand-name{
  margin-top:0;
  color:#e3c47d;
  font-size:18px;
  font-weight:800;
  letter-spacing:5px;
}
.search{
  width:100%;padding:13px 15px;border:0;border-radius:12px;
  font-size:16px;outline:0;background:#fff;color:var(--text);
}
main{padding:15px;max-width:760px;margin:auto}
.toolbar{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;margin-bottom:12px;flex-wrap:wrap;
}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{
  border:0;border-radius:11px;padding:11px 13px;font-weight:700;
  cursor:pointer;font-size:14px;
}
.primary{background:var(--green);color:white}
.secondary{
  background:var(--paper);color:var(--green);
  border:1px solid var(--line);
}
.toggle{
  background:var(--gold);color:white;
  border:1px solid #9e752e;
}
.status{font-size:13px;color:var(--muted);margin:0 0 12px}
.card{
  background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:15px;margin:12px 0;
  box-shadow:0 3px 14px #1f3b2b12;
}
.name{
  font-size:20px;font-weight:750;margin-bottom:12px;
  text-transform:capitalize;color:var(--green);
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cell{background:#f5f0e7;border-radius:10px;padding:10px}
.cell.cp-cell{background:#efe6d2;border:1px solid #dfc99f}
.label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.value{font-size:17px;font-weight:750;margin-top:3px;color:var(--text)}
.cp-hidden .cp-cell{display:none}
.card-actions{margin-top:12px;display:flex;gap:8px}
.small{font-size:13px;color:var(--muted);margin:6px 0 14px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
dialog{
  border:0;border-radius:18px;width:min(94%,520px);padding:0;
  box-shadow:0 10px 40px #0005;background:var(--paper);
}
form{padding:20px}form h2{margin-top:0;color:var(--green)}
.field{margin:10px 0}
label{display:block;font-size:13px;margin-bottom:5px;color:var(--muted);font-weight:650}
input[type=text],input[type=number]{
  width:100%;padding:11px;border:1px solid #d8cdbb;border-radius:10px;
  font-size:16px;background:white;color:var(--text);
}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formbuttons{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
@media(min-width:650px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .logo{width:78px;height:78px}
}
@media(max-width:480px){
  header{padding:14px 12px 16px}
  .brand{gap:6px}
  .logo{width:76px;height:76px}
  .brand-name{font-size:17px;letter-spacing:4px}
  main{padding:12px}
  .toolbar{align-items:stretch}
  .actions{width:100%}
  .actions button{flex:1}
  .toggle{width:100%}
}
</style>
</head>

      <div class="brand-name">DHAMGHAR</div>
    </div>
  </div>
  <input id="search" class="search" placeholder="Search masala..." autocomplete="off">
</header>

<main>
  <div class="toolbar">
    <div class="actions">
      <button class="primary" onclick="openAdd()">＋ Add Masala</button>
      <button class="secondary" onclick="resetData()">Reset</button>
    </div>
    <button id="cpToggle" class="toggle" onclick="toggleCP()">Hide CP</button>
  </div>

  <div class="small" id="count"></div>
  <div id="list"></div>
</main>

<dialog id="dlg">
<form onsubmit="saveMasala(event)">
  <h2 id="dialogTitle">Add Masala</h2>
  <input type="hidden" id="editIndex">
  <div class="field"><label>Masala name</label><input id="NAME" type="text" required></div>
  <div class="formgrid">
    <div class="field"><label>CP</label><input id="CP" type="number"></div>
    <div class="field"><label>Price / SP</label><input id="Price" type="number"></div>
    <div class="field"><label>50g</label><input id="g50" type="number"></div>
    <div class="field"><label>100g</label><input id="g100" type="number"></div>
    <div class="field"><label>200g</label><input id="g200" type="number"></div>
    <div class="field"><label>250g</label><input id="g250" type="number"></div>
    <div class="field"><label>1kg</label><input id="kg1" type="number"></div>
  </div>
  <div class="formbuttons">
    <button type="button" class="secondary" onclick="dlg.close()">Cancel</button>
    <button class="primary" type="submit">Save</button>
  </div>
</form>
</dialog>

<script>
const initial=[
  {"NAME":"Jeera","CP":250,"Price":312,"50g":15,"100g":31,"200g":63,"250g":79,"1kg":305},
  {"NAME":"Dhania","CP":190,"Price":237,"50g":12,"100g":24,"200g":48,"250g":50,"1kg":232},
  {"NAME":"Lal mirch","CP":300,"Price":375,"50g":18,"100g":37,"200g":75,"250g":94,"1kg":366},
  {"NAME":"kaali mirch","CP":800,"Price":1000,"50g":50,"100g":101,"200g":202,"250g":253,"1kg":971}
];

const key="masala-price-list-v1";
const cpKey="masala-price-list-cp-visible-v1";
let data=JSON.parse(localStorage.getItem(key)||"null")||initial;
let cpVisible=localStorage.getItem(cpKey)!=="false";
const dlg=document.getElementById("dlg");
const ids=["NAME","CP","Price","g50","g100","g200","g250","kg1"];

function money(v){return v===""||v==null?"—":"₹"+v}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function save(){localStorage.setItem(key,JSON.stringify(data));render()}
function toggleCP(){
  cpVisible=!cpVisible;
  localStorage.setItem(cpKey,String(cpVisible));
  render();
}
function render(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const m=data.map((x,i)=>[x,i]).filter(([x])=>String(x.NAME).toLowerCase().includes(q));
  document.getElementById("count").textContent=m.length+" masala"+(m.length===1?"":"s");
  document.getElementById("cpToggle").textContent=cpVisible?"Hide CP":"Show CP";
  document.getElementById("list").innerHTML=m.length?m.map(([x,i])=>`
    <div class="card ${cpVisible?"":"cp-hidden"}">
      <div class="name">${esc(x.NAME)}</div>
      <div class="grid">
        <div class="cell cp-cell"><div class="label">CP</div><div class="value">${money(x.CP)}</div></div>
        <div class="cell"><div class="label">Price / SP</div><div class="value">${money(x.Price)}</div></div>
        <div class="cell"><div class="label">50g</div><div class="value">${money(x["50g"])}</div></div>
        <div class="cell"><div class="label">100g</div><div class="value">${money(x["100g"])}</div></div>
        <div class="cell"><div class="label">200g</div><div class="value">${money(x["200g"])}</div></div>
        <div class="cell"><div class="label">250g</div><div class="value">${money(x["250g"])}</div></div>
        <div class="cell"><div class="label">1kg</div><div class="value">${money(x["1kg"])}</div></div>
      </div>
      <div class="card-actions">
        <button class="secondary" onclick="openEdit(${i})">✏️ Edit</button>
      </div>
    </div>`).join(""):`<div class="empty">No masala found.</div>`;
}
function openAdd(){
  document.getElementById("dialogTitle").textContent="Add Masala";
  document.getElementById("editIndex").value="";
  ids.forEach(id=>document.getElementById(id).value="");
  dlg.showModal();
}
function openEdit(i){
  let x=data[i];
  document.getElementById("dialogTitle").textContent="Edit Masala";
  document.getElementById("editIndex").value=i;
  ids.forEach(id=>{
    let k={"g50":"50g","g100":"100g","g200":"200g","g250":"250g","kg1":"1kg"}[id]||id;
    document.getElementById(id).value=x[k]??"";
  });
  dlg.showModal();
}
function saveMasala(e){
  e.preventDefault();
  let i=document.getElementById("editIndex").value,x={};
  ids.forEach(id=>{
    let k={"g50":"50g","g100":"100g","g200":"200g","g250":"250g","kg1":"1kg"}[id]||id;
    let v=document.getElementById(id).value;
    x[k]=id==="NAME"?v:(v===""?"":Number(v));
  });
  if(i==="")data.push(x);else data[Number(i)]=x;
  save();dlg.close();
}
function resetData(){
  if(confirm("Reset to the original masala data?")){
    data=JSON.parse(JSON.stringify(initial));save();
  }
}
document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
